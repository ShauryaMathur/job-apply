version: "3.9"

services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: job-apply-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobapply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobapply}
      POSTGRES_DB: ${POSTGRES_DB:-jobapply}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobapply} -d ${POSTGRES_DB:-jobapply}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - job-apply-net

  # ============================================================
  # ChromaDB Vector Database
  # ============================================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: job-apply-chromadb
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - job-apply-net

  # ============================================================
  # PDF Worker (LaTeX → PDF compiler)
  # ============================================================
  pdfworker:
    build:
      context: .
      dockerfile: docker/Dockerfile.pdfworker
    container_name: job-apply-pdfworker
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - job-apply-net

  # ============================================================
  # Backend (FastAPI)
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: job-apply-backend
    environment:
      # LLM
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Database
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-jobapply}:${POSTGRES_PASSWORD:-jobapply}@postgres:5432/${POSTGRES_DB:-jobapply}
      # ChromaDB
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      # AWS S3
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      # Google Sheets
      - GOOGLE_SHEETS_CREDENTIALS_JSON=${GOOGLE_SHEETS_CREDENTIALS_JSON:-}
      - GOOGLE_SPREADSHEET_ID=${GOOGLE_SPREADSHEET_ID:-}
      # PDF Worker
      - PDF_WORKER_URL=http://pdfworker:8001
      # Jobright session profile (created by scripts/jobright_login.py)
      - JOBRIGHT_PROFILE_DIR=/jobright-profile
      # App
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./resumes:/app/resumes:ro
      - ./generated:/app/generated
      - ./config.yaml:/app/config.yaml:ro
      - ./jobright-profile:/jobright-profile:ro
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      pdfworker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - job-apply-net

  # ============================================================
  # Frontend (Next.js)
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: job-apply-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - job-apply-net

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:
    driver: local
  chroma_data:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  job-apply-net:
    driver: bridge
